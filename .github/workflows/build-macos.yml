name: Build macOS (arm64)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      VSCODE_ARCH: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            build/node_modules
            extensions/**/node_modules
            remote/node_modules
            remote/web/node_modules
            test/**/node_modules
          key: node-modules-macos-arm64-${{ hashFiles('.nvmrc', '**/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --break-system-packages setuptools
          for i in 1 2 3; do npm ci && break || sleep 15; done

      - name: Build app
        run: npm run gulp vscode-darwin-arm64-min

      - name: Ad-hoc sign and zip
        run: |
          APP=$(ls -d ../VSCode-darwin-arm64/*.app)
          codesign --force --deep --sign - "$APP"
          NAME=$(basename "$APP" .app | tr ' ' '-')
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$NAME-darwin-arm64.zip"
          echo "ZIP=$NAME-darwin-arm64.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: ${{ env.ZIP }}
          retention-days: 14

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
